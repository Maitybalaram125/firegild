
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.phone {
    width: 360px;
    background: white;
    padding: 35px 28px;
    border-radius: 28px;
    box-shadow: 0 10px 40px #0001;
}

h1 {
    text-align: center;
    margin: 25px 0 15px;
    color: #222;
}

.sub {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 40px;
    line-height: 1.5;
}

.group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 10px;
}

.input-box {
    position: relative;
}

input:not([type="checkbox"]) {
    width: 100%;
    padding: 16px;
    border: 0;
    background: #f4f4f4;
    border-radius: 8px;
    outline: none;
}

.toggle {
    position: absolute;
    right: 14px;
    top: 14px;
    cursor: pointer;
}

.terms {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 25px 0;
    font-size: 13px;
}

.terms input {
    accent-color: #7200bd;
}

a {
    color: #7200bd;
    font-size: 13px;
    font-weight: bold;
}

button {
    cursor: pointer;
}

.main-btn {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 30px;
    background: linear-gradient(90deg,#6500b5,#9000d5);
    color: white;
    font-size: 16px;
}

.divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #999;
    margin: 35px 0 25px;
    font-size: 13px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: #eee;
}

.social {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.social button {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: white;
    border: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: center;
}

.bottom {
    text-align: center;
    margin-top: 35px;
    font-size: 13px;
    color: #555;
}
</style>
</head>

<body>

<div class="phone">

<h1>Create Account</h1>

<p class="sub">
Fill your information below or register<br>
with your social account.
</p>

<form onsubmit="event.preventDefault(); alert('Registration system requires backend connection!')">

<div class="group">
<label>Name</label>
<input type="text" placeholder="Ex. John Doe" required>
</div>

<div class="group">
<label>Email</label>
<input type="email" placeholder="example@gmail.com" required>
</div>

<div class="group">
<label>Password</label>
<div class="input-box">
<input type="password" id="registerPassword" placeholder="Create password" required minlength="6">
<span class="toggle" onclick="togglePassword()">👁</span>
</div>
</div>

<div class="terms">
<input type="checkbox" id="agree" required>
<label for="agree">
Agree with <a href="#">Terms & Condition</a>
</label>
</div>

<button class="main-btn" type="submit">Sign Up</button>

</form>

<div class="divider">Or sign up with</div>

<div class="social">

<button type="button" aria-label="Apple">
<svg viewBox="0 0 24 24" width="25" height="25" fill="black">
<path d="M16.4 12.1c0-2 1.6-3 1.7-3.1-.9-1.3-2.3-1.5-2.8-1.5-1.2-.1-2.2.7-2.8.7-.6 0-1.5-.7-2.5-.7-1.3 0-2.5.8-3.2 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6s1.5.6 2.5.6 1.7-1 2.3-2c.7-1 1-2 1-2.1-.1 0-2.1-.8-2.1-3.3zM14.6 5.7c.5-.6.8-1.4.7-2.2-.7 0-1.6.5-2.1 1.1-.5.5-.9 1.3-.8 2.1.8.1 1.6-.4 2.2-1z"/>
</svg>
</button>

<button type="button" aria-label="Google">
<svg viewBox="0 0 48 48" width="27" height="27">
<path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"/>
<path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20.4 20.4 0 0 0 24 44z"/>
<path fill="#FBBC05" d="M12.6 27.6a12.3 12.3 0 0 1 0-7.2v-5.3H5.8a20.4 20.4 0 0 0 0 17.8z"/>
<path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3l5.8-5.8C34.1 5.9 29.5 4 24 4A20.4 20.4 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12z"/>
</svg>
</button>

<button type="button" aria-label="Facebook">
<svg viewBox="0 0 24 24" width="27" height="27" fill="#1877F2">
<path d="M13.5 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"/>
</svg>
</button>

</div>

<div class="bottom">
Already have an account?
<a href="index.html">Sign In</a>
</div>

</div>

<script>
function togglePassword() {
    let p = document.getElementById("registerPassword");
    p.type = p.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
